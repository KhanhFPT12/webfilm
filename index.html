<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F472B6" />
    <meta name="description" content="Nơi xem phim của Sony — góc rạp phim hồng nhỏ xinh để tìm và xem phim mỗi ngày." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/logo.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://img.nguonc.com" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Áp chế độ sáng/tối trước khi vẽ trang để không bị nháy màu.
      (function () {
        try {
          var t = localStorage.getItem("sony.theme");
          var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
          if (dark) document.querySelector("meta[name=theme-color]").setAttribute("content", "#160a12");
        } catch (e) {}
      })();
    </script>
    <title>SONY · Nơi xem phim của Sony</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
